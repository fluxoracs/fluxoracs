<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi panel | Fluxora Creative Studio</title>
<meta name="theme-color" content="#0b0b0c"><meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="favicon1.png" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="favicon2.png" media="(prefers-color-scheme: light)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style id="pgstyle">@page{size:letter portrait;margin:12mm}</style>
<style>
/* ── reset ── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font:400 .88rem/1.5 Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* ── tokens ── */
:root{
  --bg:#0a0a0b;
  --surface:rgba(255,255,255,.05);
  --surface2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.09);
  --border2:rgba(255,255,255,.16);
  --ink:#f0f0f2;
  --ink2:#c8c8cc;
  --muted:#6e6e76;
  --accent:#fff;
  --ease:cubic-bezier(.22,1,.36,1);
  --sidebar-w:220px;
  --sidebar-w-col:64px;
  --radius:14px;
  --win-radius:16px;
  --taskbar:48px;
}

/* ── layout shell ── */
#shell{display:flex;height:100vh;width:100vw;background:var(--bg);position:relative;overflow:hidden}

/* ── grid wallpaper ── */
#shell::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:radial-gradient(ellipse 120% 90% at 60% 40%,#000 20%,transparent 100%);
  mask-image:radial-gradient(ellipse 120% 90% at 60% 40%,#000 20%,transparent 100%)}

/* ══════════════
   SIDEBAR
══════════════ */
#sidebar{
  position:relative;z-index:20;
  width:var(--sidebar-w);
  min-width:var(--sidebar-w);
  height:100vh;
  background:rgba(10,10,11,.85);
  backdrop-filter:blur(24px);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:width .35s var(--ease),min-width .35s var(--ease);
  overflow:hidden;
}
#sidebar.collapsed{width:var(--sidebar-w-col);min-width:var(--sidebar-w-col)}

.sb-logo{
  display:flex;align-items:center;gap:.75rem;
  padding:1.1rem 1rem 1rem;
  border-bottom:1px solid var(--border);
  min-height:60px;flex-shrink:0;
}
.sb-logo img{height:26px;flex-shrink:0;display:block}
.sb-logo-text{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden}
#sidebar.collapsed .sb-logo-text{opacity:0;width:0}

.sb-toggle{
  position:absolute;top:14px;right:10px;
  width:26px;height:26px;border-radius:8px;
  background:var(--surface2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;color:var(--muted);z-index:2;flex-shrink:0;
}
.sb-toggle:hover{color:var(--ink);background:var(--surface)}
#sidebar.collapsed .sb-toggle{right:50%;transform:translateX(50%);top:16px}

.sb-section{padding:.5rem 0;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-section:last-of-type{border-bottom:0;flex:1;overflow-y:auto;overflow-x:hidden}
.sb-label{
  font-size:.6rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);padding:.6rem 1rem .3rem;white-space:nowrap;overflow:hidden;
}
#sidebar.collapsed .sb-label{opacity:0;height:0;padding:0}

.sb-item{
  display:flex;align-items:center;gap:.75rem;
  padding:.55rem 1rem;border-radius:10px;margin:1px 6px;
  color:var(--ink2);font-size:.8rem;font-weight:500;
  cursor:pointer;white-space:nowrap;overflow:hidden;
  transition:background .15s,color .15s;position:relative;
}
.sb-item:hover{background:var(--surface2);color:var(--ink)}
.sb-item.active{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.sb-item svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sidebar.collapsed .sb-item span{width:0;opacity:0}
#sidebar.collapsed .sb-item{justify-content:center;padding:.55rem 0}

.sb-badge{
  margin-left:auto;background:rgba(255,255,255,.15);border-radius:999px;
  font-size:.58rem;font-weight:700;padding:.1rem .45rem;color:var(--ink);flex-shrink:0;
}
#sidebar.collapsed .sb-badge{display:none}

.sb-user{
  padding:.85rem 1rem;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:.7rem;flex-shrink:0;
}
.sb-avatar{
  width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.12);
  border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:700;color:#fff;flex-shrink:0;text-transform:uppercase;
}
.sb-user-info{overflow:hidden;flex:1}
.sb-user-info b{display:block;font-size:.75rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user-info small{font-size:.62rem;color:var(--muted)}
#sidebar.collapsed .sb-user-info,.sb-logout-btn span{display:none}
#sidebar.collapsed .sb-user{justify-content:center;padding:.85rem 0}
.sb-logout-btn{color:var(--muted);font-size:.7rem;text-decoration:underline;text-underline-offset:3px;flex-shrink:0}
.sb-logout-btn:hover{color:var(--ink)}

/* ══════════════
   DESKTOP AREA
══════════════ */
#desktop{
  flex:1;position:relative;overflow:hidden;z-index:1;
  display:flex;flex-direction:column;
}

/* ── taskbar ── */
#taskbar{
  height:var(--taskbar);min-height:var(--taskbar);
  background:rgba(10,10,11,.7);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.5rem;
  padding:0 1rem;z-index:15;flex-shrink:0;
}
.tb-clock{margin-left:auto;font-size:.72rem;color:var(--muted);font-weight:500;white-space:nowrap}
.tb-btn{
  height:30px;padding:0 .75rem;border-radius:8px;
  background:var(--surface2);border:1px solid var(--border);
  font-size:.72rem;font-weight:600;color:var(--ink2);
  display:flex;align-items:center;gap:.4rem;
  transition:background .15s,color .15s;white-space:nowrap;
}
.tb-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.tb-btn.active{background:rgba(255,255,255,.18);color:#fff}
.tb-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tb-sep{width:1px;height:20px;background:var(--border);flex-shrink:0}

/* ── icon grid (desktop) ── */
#icon-area{
  flex:1;overflow:hidden;
  display:grid;
  grid-template-columns:repeat(auto-fill,80px);
  grid-auto-rows:88px;
  align-content:start;
  gap:.25rem;
  padding:1.2rem 1.4rem;
}
.desk-icon{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:.45rem;padding:.55rem .3rem .4rem;border-radius:12px;
  cursor:pointer;user-select:none;
  transition:background .15s;
}
.desk-icon:hover{background:rgba(255,255,255,.09)}
.desk-icon:active{background:rgba(255,255,255,.15)}
.desk-icon .di-box{
  width:46px;height:46px;border-radius:12px;
  background:rgba(255,255,255,.07);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s var(--ease),box-shadow .2s;flex-shrink:0;
}
.desk-icon:hover .di-box{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.desk-icon .di-box svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.desk-icon .di-box.c-purple{background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.3)}
.desk-icon .di-box.c-blue{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.3)}
.desk-icon .di-box.c-green{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.3)}
.desk-icon .di-box.c-amber{background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.3)}
.desk-icon .di-box.c-rose{background:rgba(244,63,94,.18);border-color:rgba(244,63,94,.3)}
.desk-icon .di-box.c-cyan{background:rgba(6,182,212,.18);border-color:rgba(6,182,212,.3)}
.desk-icon .di-box.c-white{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.desk-icon span{font-size:.65rem;font-weight:600;color:var(--ink2);text-align:center;line-height:1.3;max-width:72px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ══════════════
   WINDOWS
══════════════ */
.win{
  position:fixed;
  background:rgba(14,14,16,.96);
  backdrop-filter:blur(32px);
  border:1px solid var(--border2);
  border-radius:var(--win-radius);
  box-shadow:0 32px 80px rgba(0,0,0,.7);
  display:flex;flex-direction:column;
  overflow:hidden;
  z-index:100;
  min-width:360px;min-height:240px;
  transition:box-shadow .2s;
}
.win.focused{z-index:110;border-color:rgba(255,255,255,.22);box-shadow:0 40px 100px rgba(0,0,0,.8)}
.win.minimized{display:none}

.win-bar{
  height:42px;min-height:42px;
  background:rgba(255,255,255,.04);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.6rem;
  padding:0 .85rem;
  cursor:move;user-select:none;flex-shrink:0;
}
.win-dots{display:flex;gap:.38rem;flex-shrink:0}
.win-dot{width:11px;height:11px;border-radius:50%;cursor:pointer;transition:filter .15s}
.win-dot:hover{filter:brightness(1.3)}
.win-dot.close{background:#ef4444}
.win-dot.min{background:#f59e0b}
.win-dot.max{background:#22c55e}
.win-title{font-size:.75rem;font-weight:600;color:var(--ink2);flex:1;text-align:center;pointer-events:none}
.win-title-icon{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;margin-right:.3rem;vertical-align:-2px;flex-shrink:0}

.win-body{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:1.2rem 1.4rem 1.4rem;
  display:flex;flex-direction:column;gap:1rem;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent;
}
.win-body::-webkit-scrollbar{width:5px}.win-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:9px}

.win-resize{
  position:absolute;bottom:0;right:0;
  width:18px;height:18px;cursor:se-resize;
  display:flex;align-items:flex-end;justify-content:flex-end;padding:4px;
}
.win-resize svg{width:10px;height:10px;stroke:var(--muted);fill:none;stroke-width:1.5;opacity:.5}

/* ══════════════
   UI COMPONENTS
══════════════ */
.card{
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:1rem 1.1rem;
  display:flex;flex-direction:column;gap:.7rem;
}
.card-title{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.75rem}

h1.win-h1{font-size:1.15rem;font-weight:800;color:#fff;letter-spacing:.01em;line-height:1.2}
h2.sec{font-size:.65rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:.1rem}

.stat-card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--radius);padding:.85rem 1rem}
.stat-card small{font-size:.62rem;color:var(--muted);display:block;margin-bottom:.25rem}
.stat-card b{font-size:1.4rem;font-weight:800;color:#fff;display:block}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;height:36px;padding:0 1rem;border-radius:8px;font-weight:700;font-size:.76rem;transition:transform .1s,box-shadow .2s,background .15s;white-space:nowrap;flex-shrink:0}
.btn:active{transform:scale(.96)}
.btn-primary{background:#fff;color:#000}.btn-primary:hover{box-shadow:0 0 0 4px rgba(255,255,255,.15)}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--border)}.btn-ghost:hover{background:rgba(255,255,255,.13)}
.btn-red{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}.btn-red:hover{background:rgba(239,68,68,.2)}
.btn-sm{height:28px;padding:0 .7rem;font-size:.7rem;border-radius:6px}
.btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

input,select,textarea{
  width:100%;background:rgba(0,0,0,.4);border:1px solid var(--border);
  border-radius:9px;padding:.6rem .85rem;color:var(--ink);font:inherit;
  font-size:.8rem;outline:none;transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{border-color:rgba(255,255,255,.35)}
textarea{min-height:80px;resize:vertical}
select option{background:#111}
label.lbl{display:flex;flex-direction:column;gap:.3rem;font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.65rem}

.bd{display:inline-flex;align-items:center;gap:.25rem;padding:.15rem .55rem;border-radius:999px;font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(255,255,255,.25);color:#fff;white-space:nowrap;flex-shrink:0}
.s-solicitado,.s-pendiente{border-style:dashed}
.s-revision,.s-edicion,.s-modificaciones{border-color:#f59e0b;color:#fcd34d}
.s-entregado,.s-finalizado{border-color:#22c55e;color:#86efac;background:rgba(34,197,94,.1)}
.s-cancelado{border-color:#ef4444;color:#fca5a5;opacity:1}
.s-cancelado-dim{opacity:.5}
.bd svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

.bar{height:4px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;flex-shrink:0}
.bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .5s var(--ease)}

.pcard{
  background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;
  padding:.85rem 1rem;cursor:pointer;
  transition:border-color .25s,transform .3s var(--ease),background .15s;
  display:flex;flex-direction:column;gap:.5rem;
}
.pcard:hover{border-color:rgba(255,255,255,.3);transform:translateY(-2px);background:rgba(255,255,255,.07)}
.pcard.ok{border-color:rgba(34,197,94,.4)}.pcard.ok:hover{border-color:#4ade80;box-shadow:0 0 20px -8px #22c55e}
.pcard.proc{border-color:rgba(245,158,11,.4)}.pcard.proc:hover{border-color:#fbbf24;box-shadow:0 0 20px -8px #f59e0b}
.pcard.canc{border-color:rgba(239,68,68,.4)}.pcard.canc:hover{border-color:#f87171;box-shadow:0 0 20px -8px #ef4444}
.pcard b{font-size:.85rem;color:#fff;font-weight:700}
.pcard small{font-size:.68rem;color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:.78rem}
th{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:.5rem .6rem;border-bottom:1px solid var(--border);text-align:left;font-weight:600}
td{padding:.55rem .6rem;border-bottom:1px solid rgba(255,255,255,.05);color:var(--ink2);vertical-align:middle}
tr.clickable{cursor:pointer}tr.clickable:hover td{background:rgba(255,255,255,.04)}

.tabs-row{display:flex;gap:.3rem;border-bottom:1px solid var(--border);padding-bottom:.1px;margin-bottom:.2rem;overflow-x:auto;scrollbar-width:none}
.tabs-row::-webkit-scrollbar{display:none}
.tab-btn{padding:.4rem .85rem;border-radius:8px 8px 0 0;font-size:.74rem;font-weight:600;color:var(--muted);border:1px solid transparent;border-bottom:0;transition:all .15s;white-space:nowrap}
.tab-btn.on{background:rgba(255,255,255,.08);color:#fff;border-color:var(--border)}
.tab-btn:hover{color:var(--ink)}

.tl{list-style:none;display:flex;flex-direction:column;gap:.6rem;border-left:1px solid var(--border);padding-left:1rem}
.tl li{position:relative;font-size:.78rem;color:var(--ink2)}
.tl li::before{content:'';position:absolute;left:-1.22rem;top:.45rem;width:6px;height:6px;border-radius:50%;background:#fff}
.tl li b{color:#fff;display:block}
.tl li time{font-size:.65rem;color:var(--muted)}

.chat-area{display:flex;flex-direction:column;gap:.5rem;max-height:320px;overflow-y:auto;padding:.1rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent}
.bubble{max-width:78%;padding:.5rem .8rem;border-radius:12px;background:rgba(255,255,255,.07);align-self:flex-start}
.bubble.me{background:#fff;color:#000;align-self:flex-end}.bubble.me small{color:#555}
.bubble p{white-space:pre-wrap;font-size:.78rem;overflow-wrap:anywhere}
.bubble small{font-size:.62rem;color:var(--muted);display:block;margin-bottom:.2rem}

.badge-role{padding:.1rem .5rem;border-radius:999px;font-size:.58rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border:1px solid;white-space:nowrap}
.badge-admin{border-color:#a78bfa;color:#a78bfa}
.badge-staff{border-color:#60a5fa;color:#60a5fa}
.badge-manager{border-color:#34d399;color:#34d399}
.badge-client{border-color:#6e6e76;color:#9a9a9f}

.empty-state{text-align:center;color:var(--muted);padding:2.5rem 1rem;font-size:.8rem}

.cast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.65rem}
.ccast{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:.75rem .9rem;display:flex;flex-direction:column;gap:.25rem}
.ccast b{color:#fff;font-size:.82rem}.ccast small{color:var(--muted);font-size:.68rem}

/* ── notification dot ── */
.dot{width:7px;height:7px;border-radius:50%;background:#ef4444;flex-shrink:0}

/* ── auth overlay ── */
#auth-screen{
  position:fixed;inset:0;z-index:999;
  background:rgba(10,10,11,.97);
  display:flex;align-items:center;justify-content:center;
  padding:1rem;
}
.auth-box{
  width:100%;max-width:380px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border2);
  border-radius:20px;padding:2rem 1.75rem;
  display:flex;flex-direction:column;gap:1rem;text-align:center;
}
.auth-box img{height:36px;margin:0 auto .5rem}
.auth-box h1{font-size:1.1rem;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.02em}
.auth-box small{color:var(--muted);font-size:.76rem}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:.3rem;padding:.25rem;border-radius:999px;background:rgba(0,0,0,.5);border:1px solid var(--border)}
.seg2 button{border:0;background:none;padding:.5rem;border-radius:999px;font-size:.76rem;font-weight:700;color:var(--muted)}
.seg2 button.on{background:#fff;color:#000}
.msg-line{min-height:1.1em;color:var(--muted);font-size:.75rem}
.lnk-btn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.74rem;cursor:pointer}
.lnk-btn:hover{color:var(--ink)}

/* paper print */
.pw{overflow-x:auto}
#paper{background:#fff;color:#111;border-radius:10px;padding:1.5rem;font-size:.78rem;line-height:1.45}
#paper .phd{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:.4rem;margin-bottom:.7rem;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase}
#paper h1{color:#111;font-size:1.1rem;margin-bottom:.7rem;text-transform:none}
#paper h2{color:#111;border-bottom:1px solid #bbb;padding-bottom:.2rem;margin:.9rem 0 .4rem;font-size:.72rem;letter-spacing:.12em}
#paper small{color:#666;display:block;font-size:.58rem;text-transform:uppercase;letter-spacing:.06em}
#paper .pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.4rem .8rem}
#paper table{width:100%;border-collapse:collapse;font-size:.68rem}
#paper th{background:#eee;color:#111;border:1px solid #bbb;padding:.3rem;text-align:left}
#paper td{border:1px solid #ccc;padding:.3rem;vertical-align:top;color:#111}
#paper .tot{width:auto;margin:.7rem 0 0 auto}
#paper .fr{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.7rem}
#paper .fc{border:1px solid #bbb;padding:.45rem;break-inside:avoid}
#paper .fc img,#paper .ph{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee;display:block;margin-bottom:.35rem}
#paper p{margin:.4rem 0;color:#111}
#paper .sg{display:flex;gap:2rem;margin-top:2.5rem;flex-wrap:wrap}
#paper .sg div{flex:1;min-width:120px;text-align:center;font-size:.68rem}
#paper .sg span{display:block;border-top:1px solid #111;margin-bottom:.25rem}
@media print{html,body{overflow:auto!important}#shell{display:block!important}.win,.win-bar,.sb-toggle,#sidebar,#taskbar,#icon-area{display:none!important}#paper{border-radius:0;padding:0}@page{margin:12mm}#paper{zoom:var(--pz,1)}#paper table{table-layout:fixed}#paper td,#paper th{word-break:break-word;font-size:.6rem}}

/* ── responsive: mobile hides sidebar ── */
@media(max-width:680px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:200;transform:translateX(-100%);transition:transform .3s var(--ease)}
  #sidebar.open{transform:translateX(0)}
  #shell{display:block}
  #desktop{height:100vh}
  .win{min-width:calc(100vw - 1rem);max-width:calc(100vw - 1rem)!important;left:.5rem!important}
}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ══════════════════════════════════════
   CONFIG
══════════════════════════════════════ */
const SUPABASE_URL='https://bglrhelixubrfdpqkwjy.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJnbHJoZWxpeHVicmZkcHFrd2p5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMzU5NjIsImV4cCI6MjEwODcxMTk2Mn0.RkdhuvJ1iBWF0BzW5CtdauJPyj6VtxeL-OfrJZYhqm4';

/* ══════════════════════════════════════

══════════════════════════════════════ */
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mx=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(+n||0);
const fd=d=>d?new Date(String(d).length===10?d+'T00:00:00':d).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}):'Sin fecha';
const ft=d=>new Date(d).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const $=s=>document.querySelector(s);
const opts=(o,v)=>Object.entries(o).map(([k,t])=>`<option value="${k}"${k===v?' selected':''}>${t}</option>`).join('');
const CK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const ST={solicitado:'Solicitado',revision:'En revisión',edicion:'En edición',entregado:'Entregado',modificaciones:'En modificaciones',finalizado:'Finalizado',cancelado:'Cancelado'};
const TY={edicion:'Edición de video',diseno:'Diseño gráfico',ia:'Estrategia con IA',cortometraje:'Cortometraje',documental:'Documental',otro:'Otro'};
const MD={pendiente:'Pendiente',proceso:'En proceso',hecha:'Hecha'};
const ROLES={client:'Cliente',manager:'Manager',staff:'Colaborador',admin:'Administrador'};

const bd=s=>`<span class="bd s-${s}">${s==='entregado'||s==='finalizado'?CK:''}${ST[s]||MD[s]||s}</span>`;
const stcC=s=>s==='cancelado'?'canc':['revision','edicion','modificaciones'].includes(s)?'proc':['entregado','finalizado'].includes(s)?'ok':'';
const roleBadge=r=>`<span class="badge-role badge-${r}">${ROLES[r]||r}</span>`;
const daysLeft=p=>Math.max(0,Math.ceil(14-(Date.now()-new Date(p.cancelled_at||Date.now()))/864e5));
const okUrl=u=>/^https?:\/\//i.test(u||'')?u:null;
const ym=d=>String(d).slice(0,7),thisM=new Date().toISOString().slice(0,7);
const TODAY=new Date().toISOString().slice(0,10);

/* ══════════════════════════════════════
   APP STATE
══════════════════════════════════════ */
let sb,ch;
const S={
  u:null,p:null,
  projects:[],payments:[],profiles:[],fin:[],mem:[],docs:[],wish:[],cast:[],
  set:{},tm:null,q:{lines:[],mode:'plan'},dr:null,
  D:{ev:[],msg:[],mods:[],ap:[]},
  curProject:null,curTab:'resumen',
  dk:null,dkBack:null,fit:true,paper:'letter'
};

/* role helpers */
const admin=()=>S.p?.role==='admin';
const staff=()=>S.p?.role==='staff';
const manager=()=>S.p?.role==='manager';
const isClient=()=>S.p?.role==='client';
const team=()=>['admin','staff'].includes(S.p?.role);
const canManage=()=>['admin','staff','manager'].includes(S.p?.role);

const myProjects=()=>{
  if(admin()||staff()) return S.projects;
  if(manager()) return S.projects.filter(p=>S.mem.some(m=>m.user_id===S.u.id&&m.project_id===p.id));
  return S.projects.filter(p=>p.client_id===S.u.id);
};
const paid=id=>S.payments.filter(x=>x.project_id===id).reduce((a,x)=>a+ +x.amount,0);
const incomeOf=m=>S.payments.filter(x=>ym(x.paid_at)===m).reduce((a,x)=>a+ +x.amount,0)+(S.fin||[]).filter(x=>x.kind==='ingreso'&&ym(x.entry_date)===m).reduce((a,x)=>a+ +x.amount,0);
const expOf=m=>(S.fin||[]).filter(x=>x.kind==='gasto'&&ym(x.entry_date)===m).reduce((a,x)=>a+ +x.amount,0);

/* ══════════════════════════════════════
   DATA
══════════════════════════════════════ */
async function load(){
  const q=[
    sb.from('projects').select('*,profiles!client_id(full_name,email)').order('created_at',{ascending:false}),
    sb.from('payments').select('*').order('paid_at',{ascending:false}),
    sb.from('project_members').select('*'),
  ];
  if(admin()) q.push(
    sb.from('profiles').select('*').order('created_at'),
    sb.from('finance_entries').select('*').order('entry_date',{ascending:false}),
    sb.from('wishlist').select('*'),
    sb.from('site_settings').select('*')
  );
  if(staff()&&!admin()) q.push(
    sb.from('profiles').select('*').order('created_at'),
    sb.from('finance_entries').select('*').order('entry_date',{ascending:false})
  );
  const r=await Promise.all(q);
  if(r[0].error) throw r[0].error;
  S.projects=r[0].data||[];
  S.payments=r[1].data||[];
  S.mem=r[2].data||[];
  if(admin()){S.profiles=r[3].data||[];S.fin=r[4].data||[];S.wish=(r[5].data||[]).sort((a,b)=>(a.status==='comprado')-(b.status==='comprado')||a.priority-b.priority||String(a.created_at).localeCompare(b.created_at));S.set=Object.fromEntries((r[6].data||[]).map(x=>[x.key,x.value]))}
  if(staff()&&!admin()){S.profiles=r[3].data||[];S.fin=r[4].data||[]}
  if(canManage()){const d=await sb.from('documents').select('id,kind,title,project_id,updated_at').order('updated_at',{ascending:false});S.docs=d.data||[]}
}
async function loadProject(id){
  const g=(t,asc)=>sb.from(t).select('*').eq('project_id',id).order('created_at',{ascending:asc});
  const [e,m,o,a,c]=await Promise.all([g('project_events',false),g('messages',true),g('modifications',false),g('appeals',false),g('cast_members',true)]);
  S.D={ev:e.data||[],msg:m.data||[],mods:o.data||[],ap:a.data||[]};
  S.cast=c.data||[];
}
function sub(){if(ch)return;let tm;ch=sb.channel('rt').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(tm);tm=setTimeout(async()=>{await load();WM.refreshAll()},500)}).subscribe()}

/* ══════════════════════════════════════
   WINDOW MANAGER
══════════════════════════════════════ */
const WM={
  wins:{},   // id -> {el,title,icon}
  zTop:100,
  sideCollapsed:false,

  toggleSidebar(){
    this.sideCollapsed=!this.sideCollapsed;
    const sb=document.getElementById('sidebar');
    sb.classList.toggle('collapsed',this.sideCollapsed);
    const arrow=sb.querySelector('.sb-toggle svg path');
    if(arrow) arrow.setAttribute('d',this.sideCollapsed?'M9 18l6-6-6-6':'M15 18l-6-6 6-6');
  },

  open(id,title,icon,buildFn,opts={}){
    if(this.wins[id]){
      const w=this.wins[id].el;
      w.classList.remove('minimized');
      this.focus(id);
      if(buildFn) this._setBody(id,buildFn);
      return;
    }
    const w=document.createElement('div');
    w.className='win';
    w.id='win-'+id;
    const iw=opts.w||720,ih=opts.h||520;
    const maxX=window.innerWidth-iw-20,maxY=window.innerHeight-ih-20;
    const ox=80+Math.min(Object.keys(this.wins).length*24,maxX>0?maxX:0);
    const oy=60+Math.min(Object.keys(this.wins).length*20,maxY>0?maxY:0);
    w.style.cssText=`left:${ox}px;top:${oy}px;width:${iw}px;height:${ih}px`;
    w.innerHTML=`
      <div class="win-bar" id="winbar-${id}">
        <div class="win-dots">
          <div class="win-dot close" onclick="WM.close('${id}')"></div>
          <div class="win-dot min" onclick="WM.minimize('${id}')"></div>
          <div class="win-dot max" onclick="WM.maximize('${id}')"></div>
        </div>
        <span class="win-title">${icon?`<svg class="win-title-icon" viewBox="0 0 24 24">${icon}</svg>`:''}${esc(title)}</span>
        <div style="width:52px"></div>
      </div>
      <div class="win-body" id="winbody-${id}"></div>
      <div class="win-resize" onmousedown="WM.startResize(event,'${id}')">
        <svg viewBox="0 0 10 10"><path d="M10 0L0 10M6 0L0 6M10 4L4 10"/></svg>
      </div>`;
    document.getElementById('wins-container').appendChild(w);
    this.wins[id]={el:w,title,icon,buildFn,maximized:false};
    this.focus(id);
    this._makeDraggable(w,id);
    if(buildFn) this._setBody(id,buildFn);
    this._addTaskbarBtn(id,title);
  },

  _setBody(id,buildFn){
    const body=document.getElementById('winbody-'+id);
    if(body){body.innerHTML=buildFn();if(this.wins[id])this.wins[id].buildFn=buildFn;}
    const chat=body?.querySelector('.chat-area');
    if(chat) chat.scrollTop=chat.scrollHeight;
  },

  refresh(id){
    if(this.wins[id]?.buildFn) this._setBody(id,this.wins[id].buildFn);
  },

  refreshAll(){
    Object.keys(this.wins).forEach(id=>this.refresh(id));
    this._buildSidebar();this._buildIcons();
  },

  close(id){
    this.wins[id]?.el.remove();
    delete this.wins[id];
    document.getElementById('tb-btn-'+id)?.remove();
  },

  minimize(id){
    this.wins[id]?.el.classList.add('minimized');
    document.getElementById('tb-btn-'+id)?.classList.remove('active');
  },

  maximize(id){
    const w=this.wins[id];if(!w)return;
    if(w.maximized){
      w.el.style.cssText=w.prevStyle;w.maximized=false;
    } else {
      w.prevStyle=w.el.style.cssText;
      const sb=document.getElementById('sidebar');
      const sbW=this.sideCollapsed?64:220;
      w.el.style.cssText=`left:${sbW}px;top:48px;width:calc(100vw - ${sbW}px);height:calc(100vh - 48px);border-radius:0`;
      w.maximized=true;
    }
  },

  focus(id){
    Object.values(this.wins).forEach(w=>w.el.classList.remove('focused'));
    document.querySelectorAll('.tb-btn').forEach(b=>b.classList.remove('active'));
    const w=this.wins[id];if(!w)return;
    this.zTop++;w.el.style.zIndex=this.zTop;w.el.classList.add('focused');w.el.classList.remove('minimized');
    document.getElementById('tb-btn-'+id)?.classList.add('active');
  },

  _addTaskbarBtn(id,title){
    const btn=document.createElement('button');
    btn.className='tb-btn';btn.id='tb-btn-'+id;
    btn.innerHTML=`<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/></svg>${esc(title.length>18?title.slice(0,16)+'…':title)}`;
    btn.onclick=()=>{
      const w=this.wins[id];if(!w)return;
      if(w.el.classList.contains('minimized')||!w.el.classList.contains('focused')){this.focus(id);}
      else this.minimize(id);
    };
    document.getElementById('tb-wins').appendChild(btn);
  },

  _makeDraggable(win,id){
    const bar=document.getElementById('winbar-'+id);
    let ox,oy,dragging=false;
    bar.addEventListener('mousedown',e=>{
      if(e.target.classList.contains('win-dot')) return;
      dragging=true;ox=e.clientX-win.offsetLeft;oy=e.clientY-win.offsetTop;
      this.focus(id);e.preventDefault();
    });
    document.addEventListener('mousemove',e=>{
      if(!dragging)return;
      win.style.left=Math.max(0,e.clientX-ox)+'px';
      win.style.top=Math.max(0,e.clientY-oy)+'px';
    });
    document.addEventListener('mouseup',()=>{dragging=false});
    win.addEventListener('mousedown',()=>this.focus(id));
  },

  startResize(e,id){
    const w=this.wins[id]?.el;if(!w)return;
    e.preventDefault();
    const sx=e.clientX,sy=e.clientY,sw=w.offsetWidth,sh=w.offsetHeight;
    const mv=e2=>{w.style.width=Math.max(360,sw+e2.clientX-sx)+'px';w.style.height=Math.max(240,sh+e2.clientY-sy)+'px'};
    const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up)};
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  },

  _buildIcons(){
    const area=document.getElementById('icon-area');if(!area)return;
    const icons=this._iconList();
    area.innerHTML=icons.map(ic=>`
      <div class="desk-icon" onclick="WM.openApp('${ic.id}')">
        <div class="di-box ${ic.color}"><svg viewBox="0 0 24 24">${ic.svg}</svg></div>
        <span>${esc(ic.label)}</span>
      </div>`).join('');
  },

  _iconList(){
    const icons=[];
    const mp=myProjects();
    icons.push({id:'projects',label:'Proyectos',color:'c-blue',svg:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'});
    if(!isClient()) icons.push({id:'docs',label:'Documentos',color:'c-purple',svg:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>'});
    if(isClient()) icons.push({id:'new-project',label:'Nuevo proyecto',color:'c-green',svg:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>'});
    if(admin()||staff()) icons.push({id:'new-manual',label:'Crear proyecto',color:'c-green',svg:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/>'});
    if(admin()) icons.push({id:'pay',label:'Pagos',color:'c-amber',svg:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>'});
    if(admin()) icons.push({id:'fin',label:'Finanzas',color:'c-amber',svg:'<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>'});
    if(admin()) icons.push({id:'quote',label:'Cotizador',color:'c-cyan',svg:'<path d="M9 7H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3"/><rect x="9" y="3" width="6" height="6" rx="1"/>'});
    if(admin()) icons.push({id:'wish',label:'Wishlist',color:'c-rose',svg:'<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>'});
    if(admin()) icons.push({id:'site',label:'Mi sitio',color:'c-white',svg:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'});
    if(admin()) icons.push({id:'team',label:'Equipo',color:'c-white',svg:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M16 5a3.5 3.5 0 0 1 0 6.5M18 14c2 .7 3.5 2.5 3.5 6"/>'});
    if(admin()||staff()) icons.push({id:'clients',label:'Clientes',color:'c-white',svg:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'});
    return icons;
  },

  openApp(id){
    if(id==='new-project'){ this.open('new-project','Nuevo proyecto','<path d="M12 5v14M5 12h14"/>',()=>VIEWS.newProject(),{w:560,h:520});return;}
    if(id==='new-manual'){ this.open('new-manual','Crear proyecto','<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/>',()=>VIEWS.newManual(),{w:620,h:600});return;}
    const map={
      projects:['Proyectos','<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',()=>VIEWS.projects(),{w:780,h:540}],
      docs:['Documentos','<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',()=>VIEWS.docs(),{w:820,h:560}],
      clients:['Clientes','<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>',()=>VIEWS.clients(),{w:780,h:480}],
      pay:['Pagos','<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>',()=>VIEWS.pay(),{w:760,h:480}],
      fin:['Finanzas','<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',()=>VIEWS.fin(),{w:800,h:560}],
      quote:['Cotizador','<path d="M9 7H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3"/><rect x="9" y="3" width="6" height="6" rx="1"/>',()=>VIEWS.quote(),{w:760,h:560}],
      wish:['Wishlist','<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',()=>VIEWS.wish(),{w:760,h:580}],
      site:['Mi sitio','<circle cx="12" cy="12" r="9"/>',()=>VIEWS.site(),{w:780,h:580}],
      team:['Equipo','<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M16 5a3.5 3.5 0 0 1 0 6.5M18 14c2 .7 3.5 2.5 3.5 6"/>',()=>VIEWS.team(),{w:760,h:520}],
    };
    const m=map[id];if(!m)return;
    this.open(id,m[0],m[1],m[2],m[3]);
  },

  openProject(pid){
    S.curProject=pid;S.curTab='resumen';S.cast=[];
    loadProject(pid).then(()=>{
      const p=S.projects.find(x=>x.id===pid);if(!p)return;
      const winId='proj-'+pid;
      this.open(winId,p.title,'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',()=>VIEWS.projectDetail(pid),{w:780,h:560});
    });
  },

  setTab(pid,tab){
    S.curTab=tab;S.curProject=pid;
    this.refresh('proj-'+pid);
    const chat=document.querySelector('#winbody-proj-'+pid+' .chat-area');
    if(chat) setTimeout(()=>chat.scrollTop=chat.scrollHeight,50);
  },

  _buildSidebar(){

const fill=t=>t.replace(/\{\{(\w+)\}\}/g,(m,k)=>S.dk?.h[k]?esc(S.dk.h[k]):'________');
const cellv=(r,c)=>{const v=r[c[0]],t=c[2]||'t';return t==='c'?(v?'✓':''):t==='d'?(v?fd(v):''):t==='n$'?(v?mx(v):''):esc(v||'')};

function paperHTML(){const k=S.dk,d=DOCS[k.kind],h=k.h;
  let o=`<div class="phd"><b>FLUXORA CREATIVE STUDIO</b><span>${fd(h.fecha||TODAY)}</span></div><h1>${esc(d.n)}</h1><div class="pg">${d.head.filter(f=>f[2]!=='a').map(f=>`<div><small>${f[1]}</small><b>${f[2]==='d'?(h[f[0]]?fd(h[f[0]]):''):esc(h[f[0]]||'')}</b></div>`).join('')}</div>`;
  if(d.body)o+=d.body.map(p=>`<p>${fill(esc(p))}</p>`).join('').replace(/&quot;/g,'"');
  d.tables.forEach(tb=>{const rows=k.t[tb.k]||[];o+=`<h2>${tb.t}</h2>`;
    if(tb.frames)o+=`<div class="fr">${rows.map((r,i)=>`<div class="fc">${r.img?`<img src="${r.img}" alt="">`:'<div class="ph"></div>'}<small>Cuadro ${i+1}${r.pl?' · '+esc(r.pl):''}</small><p>${esc(r.d||'')}</p>${r.a?`<p><i>${esc(r.a)}</i></p>`:''}${r.n?`<small>${esc(r.n)}</small>`:''}</div>`).join('')}</div>`;
    else o+=`<table><tr>${tb.cols.map(c=>`<th>${c[1]}</th>`).join('')}${d.budget?'<th>Importe</th>':''}</tr>${rows.map(r=>`<tr>${tb.cols.map(c=>`<td>${cellv(r,c)}</td>`).join('')}${d.budget?`<td>${mx((+r.q||0)*(+r.p||0))}</td>`:''}</tr>`).join('')}</table>`;
  });
  if(d.budget){const sub=(k.t.rows||[]).reduce((a,r)=>a+(+r.q||0)*(+r.p||0),0),im=sub*(+h.imp||0)/100,iv=(sub+im)*(+h.iva||0)/100;o+=`<table class="tot"><tr><td>Subtotal</td><td>${mx(sub)}</td></tr><tr><td>Imprevistos (${+h.imp||0}%)</td><td>${mx(im)}</td></tr><tr><td>IVA (${+h.iva||0}%)</td><td>${mx(iv)}</td></tr><tr><th>Total ${esc(h.moneda||'MXN')}</th><th>${mx(sub+im+iv)}</th></tr></table>`}
  if(h.notas)o+=`<h2>Notas</h2><p style="white-space:pre-wrap">${esc(h.notas)}</p>`;
  if(d.sig)o+=`<div class="sg">${d.sig.map(s=>`<div><span></span>${s}</div>`).join('')}</div>`;
  return o}

function fld(c,v,ctx){const t=c[2]||'t',l=c[1],H=ctx.t?`DC.c('${ctx.t}',${ctx.i},'${c[0]}',`:`DC.h('${c[0]}',`;
  if(t==='c')return `<label style="display:flex;align-items:center;gap:.5rem;font-size:.76rem;color:var(--ink2)"><input type="checkbox" style="width:auto;accent-color:#fff"${v?' checked':''} onchange="${H}this.checked)">${l}</label>`;
  if(t==='a')return `<label class="lbl" style="grid-column:1/-1">${l}<textarea oninput="${H}this.value)">${esc(v||'')}</textarea></label>`;
  if(t==='i')return `<label class="lbl" style="grid-column:1/-1">${l}<input type="file" accept="image/*" onchange="DC.img('${ctx.t}',${ctx.i},'${c[0]}',this)">${v?`<img src="${v}" alt="" style="max-width:200px;border-radius:8px;margin-top:.4rem">`:''}</label>`;
  const ty=t==='n'||t==='n$'?'number" step="any':t==='d'?'date':t==='h'?'time':'text';
  return `<label class="lbl">${l}<input type="${ty}" value="${esc(v||'')}" oninput="${H}this.value)"></label>`}

async wdel(id){if(!confirm('¿Quitar este artículo?'))return;await sb.from('wishlist').delete().eq('id',id);await load();WM.refresh('wish')},
async wbuy(id){const w=S.wish.find(x=>x.id===id),v=prompt('Precio real pagado (MXN)',w.price);if(v===null||!(+v>=0))return;
  const r=await sb.rpc('buy_wish',{p_id:id,p_real:+v});if(r.error)alert(r.error.message);await load();WM.refresh('wish')},
async walloc(e){e.preventDefault();const a=+new FormData(e.target).get('amount'),m=document.getElementById('wmsg');
  const r=await sb.rpc('allocate_wish',{p_amount:a});if(r.error){if(m)m.textContent=r.error.message;return false}
  await load();WM.refresh('wish');const m2=document.getElementById('wmsg');
  if(m2)m2.textContent=+r.data>0?'Sobraron '+mx(r.data)+' (wishlist completa).':'Listo.';return false},
async wpct(v){const r=await sb.from('site_settings').upsert({key:'wish_pct',value:Math.min(100,Math.max(0,+v||0))});if(r.error)alert(r.error.message);await load()},
pkCollect(){const fm=document.querySelector('form[onsubmit*=siteSave]');if(!fm||!S.dr)return;
  const n=[...fm.querySelectorAll('[name=pn]')],pp=[...fm.querySelectorAll('[name=pp]')],pf=[...fm.querySelectorAll('[name=pf]')];
  S.dr.packages=n.map((x,i)=>({name:x.value.trim(),price:+pp[i].value||0,features:pf[i].value.split('\n').map(t=>t.trim()).filter(Boolean)}));
  Object.keys(S.dr.contact).forEach(k=>{if(fm.elements[k])S.dr.contact[k]=fm.elements[k].value.trim()})},
pkAdd(){A.pkCollect();S.dr.packages.push({name:'Nuevo paquete',price:0,features:[]});WM.refresh('site')},
pkRm(i){A.pkCollect();S.dr.packages.splice(i,1);WM.refresh('site')},
async siteSave(e){e.preventDefault();A.pkCollect();const m=document.getElementById('smsg');
  if(!S.dr.packages.length){if(m)m.textContent='Deja al menos un paquete.';return false}
  S.dr.contact.wa=S.dr.contact.wa.replace(/\D/g,'');S.dr.contact.ig=S.dr.contact.ig.replace('@','');
  const r=await sb.from('site_settings').upsert([{key:'packages',value:S.dr.packages},{key:'contact',value:S.dr.contact}]);
  if(r.error){if(m)m.textContent=r.error.message;return false}
  if(m)m.textContent='Guardado.';S.set.packages=S.dr.packages;S.set.contact=S.dr.contact;return false},
tmSel(id){S.tm=id;WM.refresh('team')},
async role(uid,v){if(uid===S.u.id){WM.refresh('team');return}if(!confirm('¿Cambiar el rol?')){WM.refresh('team');return}
  const r=await sb.from('profiles').update({role:v}).eq('id',uid);if(r.error)alert(r.error.message);await load();WM.refresh('team')},
async mem(uid,pid,on){const r=on?await sb.from('project_members').insert({project_id:pid,user_id:uid}):await sb.from('project_members').delete().eq('project_id',pid).eq('user_id',uid);if(r.error)alert(r.error.message);await load();WM.refresh('team')}
};

function askReason(){return new Promise(res=>{
  const d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:9999;padding:1rem';
  d.innerHTML=`<div style="background:rgba(14,14,16,.98);border:1px solid rgba(239,68,68,.4);border-radius:16px;padding:1.5rem;max-width:420px;width:100%;display:flex;flex-direction:column;gap:.85rem">
    <div class="card-title">Cancelar proyecto</div>
    <p style="font-size:.76rem;color:var(--muted)">El cliente verá este motivo y podrá apelar.</p>
    <textarea placeholder="Motivo de la cancelación" style="min-height:80px"></textarea>
    <div class="row" style="gap:.5rem;justify-content:flex-end">
      <button class="btn btn-ghost btn-sm" id="_cr_no">Volver</button>
      <button class="btn btn-red btn-sm" id="_cr_ok">Cancelar proyecto</button>
    </div>
  </div>`;
  document.body.appendChild(d);
  const ta=d.querySelector('textarea');ta.focus();
  const done=v=>{d.remove();res(v)};
  d.querySelector('#_cr_no').onclick=()=>done(null);
  d.querySelector('#_cr_ok').onclick=()=>done(ta.value.trim()||null);
})}

/* ══════════════════════════════════════
   AUTH VIEWS
══════════════════════════════════════ */
const tr=m=>{m=String(m||'');return /Invalid login/i.test(m)?'Correo o contraseña incorrectos.':/already registered/i.test(m)?'Ese correo ya tiene cuenta. Usa "Entrar".':/Email not confirmed/i.test(m)?'Confirma tu correo antes de entrar.':/at least 6/i.test(m)?'La contraseña debe tener mínimo 6 caracteres.':/rate limit/i.test(m)?'Demasiados intentos. Espera un momento.':m};

function showAuth(m){m=m||(location.hash==='#registro'?'up':'in');const up=m==='up';
  document.getElementById('auth-inner').innerHTML=`
    <div class="seg2"><button class="${up?'':'on'}" onclick="showAuth('in')">Entrar</button><button class="${up?'on':''}" onclick="showAuth('up')">Crear cuenta</button></div>
    <h1>${up?'Crea tu cuenta':'Bienvenido de vuelta'}</h1>
    <small>${up?'Regístrate para seguir tus proyectos.':'Sigue tus proyectos y habla con nosotros.'}</small>
    <form onsubmit="return A.auth(event,'${m}')" style="display:flex;flex-direction:column;gap:.65rem;text-align:left">
      ${up?'<label class="lbl">Nombre<input name="name" placeholder="Nombre completo" autocomplete="name" required></label>':''}
      <label class="lbl">Correo<input name="email" type="email" placeholder="tu@correo.com" autocomplete="email" required></label>
      <label class="lbl">Contraseña<input name="pass" type="password" placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="${up?'new-password':'current-password'}" required></label>
      ${up?'<label class="lbl">Repite la contraseña<input name="pass2" type="password" placeholder="Repite la contraseña" minlength="6" autocomplete="new-password" required></label>':''}
      <button class="btn btn-primary" style="margin-top:.25rem">${up?'Crear mi cuenta':'Entrar'}</button>
    </form>
    <p class="msg-line" id="auth-msg"></p>
    ${up?'':`<button type="button" class="lnk-btn" onclick="A.reset()">Olvidé mi contraseña</button>`}`;
}
function showRecovery(){
  document.getElementById('auth-inner').innerHTML=`
    <h1>Nueva contraseña</h1>
    <form onsubmit="return A.newpass(event)" style="display:flex;flex-direction:column;gap:.65rem;text-align:left">
      <label class="lbl">Nueva contraseña<input name="pass" type="password" minlength="6" required></label>
      <label class="lbl">Repite la contraseña<input name="pass2" type="password" minlength="6" required></label>
      <button class="btn btn-primary">Guardar contraseña</button>
    </form>
    <p class="msg-line" id="auth-msg"></p>`;}

/* ══════════════════════════════════════
   CLOCK
══════════════════════════════════════ */
function tickClock(){
  const el=document.getElementById('tb-clock');if(!el)return;
  el.textContent=new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})+'  '+new Date().toLocaleDateString('es-MX',{weekday:'short',day:'2-digit',month:'short'});
}
setInterval(tickClock,10000);

/* ══════════════════════════════════════
   BOOT
══════════════════════════════════════ */
async function bootApp(u){
  try{
    S.u=u;
    const r=await sb.from('profiles').select('*').eq('id',u.id).single();
    S.p=r.data;
    await load();
    sub();
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('shell').style.display='flex';
    WM._buildSidebar();
    WM._buildIcons();
    tickClock();
    // open projects window by default
    WM.openApp('projects');
  }catch(e){
    document.getElementById('auth-inner').innerHTML=`<h1 style="color:#fff">Error al cargar</h1><small>${esc(e.message)}</small><button class="btn btn-primary" onclick="bootApp(S.u)">Reintentar</button>`;
    document.getElementById('auth-screen').style.display='flex';
    document.getElementById('shell').style.display='none';
  }
}

sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
S.rec=location.hash.includes('type=recovery');
showAuth();
document.getElementById('auth-screen').style.display='flex';
document.getElementById('shell').style.display='none';

sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==='PASSWORD_RECOVERY') S.rec=true;
  if(session?.user&&S.rec){setTimeout(showRecovery,0)}
  else if(session?.user){
    if(!S.u||S.u.id!==session.user.id) setTimeout(()=>bootApp(session.user),0);
  } else {
    S.u=null;S.p=null;
    if(ch){sb.removeChannel(ch);ch=null}
    Object.keys(WM.wins).forEach(id=>WM.close(id));
    document.getElementById('shell').style.display='none';
    document.getElementById('auth-screen').style.display='flex';
    showAuth();
  }
});
</script>
