<style>
:root{--ink:#f5f5f7;--ink2:#e4e4e8;--muted:#9a9a9f;--line:rgba(255,255,255,.1);--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}

.who{display:flex;align-items:center;gap:.8rem;font-size:.75rem;color:var(--muted)}
.lnk{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.8rem;padding:.3rem 0}.lnk:hover{color:#fff}
.pm{max-width:1100px;margin:0 auto;padding:clamp(1.2rem,4vw,2.5rem) clamp(1rem,3vw,2rem) 4rem;display:grid;gap:1.2rem}

h2{font-size:.78rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

.card{background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:20px;padding:clamp(1rem,3vw,1.5rem);display:grid;gap:.8rem}
.pc{cursor:pointer;transition:transform .4s var(--ease),border-color .3s}.pc:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}

.row2{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .6s var(--ease)}
.bd{padding:.2rem .7rem;border-radius:999px;font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(255,255,255,.35);color:#fff;white-space:nowrap}
.s-finalizado{background:#fff;color:#000}.s-cancelado{opacity:.5}.s-solicitado,.s-pendiente{border-style:dashed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;height:44px;padding:0 1.4rem;border-radius:999px;border:0;font-weight:700;font-size:.82rem;transition:transform .12s,box-shadow .3s}.btn:active{transform:scale(.96)}
.btn-dark{background:#fff;color:#000}.btn-dark:hover{box-shadow:0 0 0 5px rgba(255,255,255,.15)}
.btn-light{background:rgba(255,255,255,.1);color:#fff}
.btn-red{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid #ef4444}
input,select,textarea{width:100%;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:12px;padding:.75rem 1rem;color:var(--ink);font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:#fff}textarea{min-height:90px;resize:vertical}select option{background:#111}

.pc.st-cancelado:hover{border-color:#f87171;box-shadow:0 0 28px -10px #ef4444}.pc.st-proceso:hover{border-color:#fbbf24;box-shadow:0 0 28px -10px #f59e0b}.pc.st-ok:hover{border-color:#4ade80;box-shadow:0 0 28px -10px #22c55e}
.bd.s-cancelado{border-color:#ef4444;color:#fca5a5;opacity:1}
.bd.s-revision,.bd.s-edicion,.bd.s-modificaciones{border-color:#f59e0b;color:#fcd34d}
.bd.s-entregado,.bd.s-finalizado{border-color:#22c55e;color:#86efac;background:rgba(34,197,94,.14)}
.bd svg{width:11px;height:11px;margin-right:.3rem;vertical-align:-1px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:1rem;z-index:50;overflow-y:auto}.ov .inner{max-width:500px;width:100%}
.ov .card{border-color:#ef4444}
.ov-neu .card{border-color:var(--line)}

.pw{overflow-x:auto}
#paper{background:#fff;color:#111;border-radius:14px;padding:clamp(1rem,4vw,2.2rem);font-size:.82rem;line-height:1.45;min-width:0}
#paper .phd{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:.5rem;margin-bottom:.8rem;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase}
#paper h1{color:#111;font-size:1.25rem;margin-bottom:.8rem;text-transform:none}
#paper h2{color:#111;border-bottom:1px solid #bbb;padding-bottom:.2rem;margin:1rem 0 .5rem}
#paper small{color:#666;display:block;font-size:.6rem;text-transform:uppercase;letter-spacing:.08em}
#paper .pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem 1rem}
#paper table{width:100%;border-collapse:collapse;font-size:.72rem}
#paper th{background:#eee;color:#111;border:1px solid #bbb;padding:.35rem;text-align:left;letter-spacing:.04em}
#paper td{border:1px solid #ccc;padding:.35rem;vertical-align:top;color:#111}
#paper .tot{width:auto;margin:.8rem 0 0 auto}
#paper .fr{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}
#paper .fc{border:1px solid #bbb;padding:.5rem;break-inside:avoid}
#paper .fc img,#paper .ph{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee;display:block;margin-bottom:.4rem}
#paper p{margin:.5rem 0;color:#111}
#paper .sg{display:flex;gap:2rem;margin-top:3rem;flex-wrap:wrap}#paper .sg div{flex:1;min-width:140px;text-align:center;font-size:.72rem}#paper .sg span{display:block;border-top:1px solid #111;margin-bottom:.3rem}
@media print{html,body{background:#fff!important}.glow,.top,.pm>*:not(.pw){display:none!important}.pm{padding:0;max-width:none;display:block}#paper{border-radius:0;padding:0}@page{margin:12mm}}

.fold{gap:.4rem}.fold svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:.3rem}
.crumb{color:var(--muted);font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:0 .5rem;white-space:nowrap}
@media print{#paper{zoom:var(--pz,1)}#paper table{table-layout:fixed}#paper td,#paper th{word-break:break-word;font-size:.62rem}}

/* reparto cards */
.cast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}
.cast-card{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:.9rem;display:grid;gap:.35rem}
.cast-card b{color:#fff;font-size:.88rem}
.cast-card small{color:var(--muted);font-size:.72rem}
</style>

<script>
/* ===== CONFIGURACION ===== */
const SUPABASE_URL='https://bglrhelixubrfdpqkwjy.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJnbHJoZWxpeHVicmZkcHFrd2p5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMzU5NjIsImV4cCI6MjEwODcxMTk2Mn0.RkdhuvJ1iBWF0BzW5CtdauJPyj6VtxeL-OfrJZYhqm4';
/* ======================== */

const app=document.getElementById('app');
const $=s=>document.querySelector(s);
const ST={solicitado:'Solicitado',revision:'En revisión',edicion:'En edición',entregado:'Entregado',modificaciones:'En modificaciones',finalizado:'Finalizado',cancelado:'Cancelado'};
const TY={edicion:'Edición de video',diseno:'Diseño gráfico',ia:'Estrategia con IA',cortometraje:'Cortometraje',documental:'Documental',otro:'Otro'};
const MD={pendiente:'Pendiente',proceso:'En proceso',hecha:'Hecha'};
const ROLES={client:'Cliente',manager:'Manager',staff:'Colaborador',admin:'Administrador'};
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mx=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(+n||0);
const fd=d=>d?new Date(String(d).length===10?d+'T00:00:00':d).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}):'Sin fecha';
const ft=d=>new Date(d).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const CK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const bd=s=>`<span class="bd s-${s}">${s==='entregado'||s==='finalizado'?CK:''}${ST[s]||MD[s]||s}</span>`;
const stc=s=>s==='cancelado'?'st-cancelado':['revision','edicion','modificaciones'].includes(s)?'st-proceso':['entregado','finalizado'].includes(s)?'st-ok':'';
const roleBadge=r=>`<span class="badge-role badge-${r}">${ROLES[r]||r}</span>`;
const daysLeft=p=>Math.max(0,Math.ceil(14-(Date.now()-new Date(p.cancelled_at||Date.now()))/864e5));

function askReason(){return new Promise(res=>{const d=document.createElement('div');d.className='ov';d.innerHTML='<div class="inner"><form class="card"><h2>Cancelar proyecto</h2><small>El cliente verá este motivo y podrá enviar una apelación.</small><textarea required placeholder="Motivo de la cancelación"></textarea><div class="row2"><button type="button" class="btn btn-light">Volver</button><button class="btn btn-dark">Cancelar proyecto</button></div></form></div>';document.body.appendChild(d);const t=d.querySelector('textarea');t.focus();const done=v=>{d.remove();res(v)};d.querySelector('.btn-light').onclick=()=>done(null);d.querySelector('form').onsubmit=e=>{e.preventDefault();done(t.value.trim()||null)}})}

const opts=(o,v)=>Object.entries(o).map(([k,t])=>`<option value="${k}" ${k===v?'selected':''}>${t}</option>`).join('');
let sb,ch;
let S={mem:[],tm:null,fit:true,paper:'letter',dkBack:null,docs:[],dk:null,wish:[],set:{},q:{lines:[],mode:'plan'},dr:null,u:null,p:null,projects:[],payments:[],profiles:[],fin:[],cast:[],view:'home',id:null,tab:'resumen',f:'',D:{ev:[],msg:[],mods:[],ap:[]}};

/* ── role helpers ── */
const admin=()=>S.p&&S.p.role==='admin';
const staff=()=>S.p&&S.p.role==='staff';
const manager=()=>S.p&&S.p.role==='manager';
const team=()=>S.p&&['admin','staff'].includes(S.p.role);        // full back-office
const canManage=()=>S.p&&['admin','staff','manager'].includes(S.p.role); // can touch projects

/* manager sees only assigned projects */
const myProjects=()=>{
  if(admin()||staff()) return S.projects;
  if(manager()) return S.projects.filter(p=>S.mem.some(m=>m.user_id===S.u.id&&m.project_id===p.id));
  return S.projects.filter(p=>p.client_id===S.u.id);
};

const paid=id=>S.payments.filter(x=>x.project_id===id).reduce((a,x)=>a+ +x.amount,0);
const ym=d=>String(d).slice(0,7),thisM=new Date().toISOString().slice(0,7);

/* ── auth views ── */
function authView(m){m=m||(location.hash==='#registro'?'up':'in');const up=m==='up';
  app.innerHTML=`<div class="card auth"><a href="index.html"><img src="1.1.png" alt="Fluxora"></a><div class="seg"><button class="${up?'':'on'}" onclick="authView('in')">Entrar</button><button class="${up?'on':''}" onclick="authView('up')">Crear cuenta</button></div><h1>${up?'Crea tu cuenta':'Bienvenido de vuelta'}</h1><small>${up?'Regístrate para pedir tus proyectos y darles seguimiento.':'Sigue tus proyectos, pide modificaciones y habla con nosotros.'}</small><form onsubmit="return A.auth(event,'${m}')">${up?'<input name="name" placeholder="Nombre completo" autocomplete="name" required>':''}<input name="email" type="email" placeholder="Correo" autocomplete="email" required><input name="pass" type="password" placeholder="Contraseña (mínimo 6 caracteres)" minlength="6" autocomplete="${up?'new-password':'current-password'}" required>${up?'<input name="pass2" type="password" placeholder="Repite la contraseña" minlength="6" autocomplete="new-password" required>':''}<button class="btn btn-dark">${up?'Crear mi cuenta':'Entrar'}</button></form><p class="msg2" id="msg"></p>${up?'':'<button type="button" class="lnk" onclick="A.reset()">Olvidé mi contraseña</button>'}</div>`}
function recView(){app.innerHTML=`<div class="card auth"><a href="index.html"><img src="1.1.png" alt="Fluxora"></a><h1>Nueva contraseña</h1><small>Escribe la contraseña nueva para tu cuenta.</small><form onsubmit="return A.newpass(event)"><input name="pass" type="password" minlength="6" placeholder="Nueva contraseña (mínimo 6)" autocomplete="new-password" required><input name="pass2" type="password" minlength="6" placeholder="Repite la contraseña" autocomplete="new-password" required><button class="btn btn-dark">Guardar contraseña</button></form><p class="msg2" id="msg"></p></div>`}
const tr=m=>{m=String(m||'');return /Invalid login/i.test(m)?'Correo o contraseña incorrectos.':/already registered|already been registered/i.test(m)?'Ese correo ya tiene cuenta. Usa "Entrar".':/Email not confirmed/i.test(m)?'Confirma tu correo antes de entrar. Revisa tu bandeja.':/at least 6/i.test(m)?'La contraseña debe tener mínimo 6 caracteres.':/rate limit/i.test(m)?'Demasiados intentos. Espera un momento.':m}

/* ── data load ── */
async function load(){
  const q=[
    sb.from('projects').select('*,profiles!client_id(full_name,email)').order('created_at',{ascending:false}),
    sb.from('payments').select('*').order('paid_at',{ascending:false}),
    sb.from('project_members').select('*'),
  ];
  if(admin()) q.push(
    sb.from('profiles').select('*').order('created_at'),
    sb.from('finance_entries').select('*').order('entry_date',{ascending:false}),
    sb.from('wishlist').select('*'),
    sb.from('site_settings').select('*')
  );
  if(staff()&&!admin()) q.push(
    sb.from('profiles').select('*').order('created_at'),
    sb.from('finance_entries').select('*').order('entry_date',{ascending:false})
  );
  const r=await Promise.all(q);
  if(r[0].error) throw r[0].error;
  S.projects=r[0].data||[];
  S.payments=r[1].data||[];
  S.mem=r[2].data||[];
  if(admin()){S.profiles=r[3].data||[];S.fin=r[4].data||[];S.wish=(r[5].data||[]).sort((a,b)=>(a.status==='comprado')-(b.status==='comprado')||a.priority-b.priority||String(a.created_at).localeCompare(b.created_at));S.set=Object.fromEntries((r[6].data||[]).map(x=>[x.key,x.value]))}
  if(staff()&&!admin()){S.profiles=r[3].data||[];S.fin=r[4].data||[]}
  if(canManage()){const d=await sb.from('documents').select('id,kind,title,project_id,updated_at').order('updated_at',{ascending:false});S.docs=d.data||[]}
  if(S.id) await loadD();
}
async function loadD(){
  const g=(t,a)=>sb.from(t).select('*').eq('project_id',S.id).order('created_at',{ascending:a});
  const [e,m,o,a,c]=await Promise.all([g('project_events',false),g('messages',true),g('modifications',false),g('appeals',false),g('cast_members',true)]);
  S.D={ev:e.data||[],msg:m.data||[],mods:o.data||[],ap:a.data||[]};
  S.cast=c.data||[];
}
function sub(){if(ch)return;let tm;ch=sb.channel('rt').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(tm);tm=setTimeout(async()=>{await load();render(true)},400)}).subscribe()}
async function init(u){try{S.u=u;const r=await sb.from('profiles').select('*').eq('id',u.id).single();S.p=r.data;await load();sub();render()}catch(e){app.innerHTML='<div class="card auth"><h1>No pudimos cargar tu panel</h1><small>'+esc(e.message||'Error de conexión')+'</small><button class="btn btn-dark" onclick="init(S.u)">Reintentar</button></div>'}}

const folders=()=>{

const foldOf=v=>S.id?folders()[0]:folders().find(f=>f.v&&f.v.some(x=>x[0]===v));

/* ── render shell ── */
function render(keep){
  if(keep&&document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  let nav='',sub='';
  const role=S.p&&S.p.role;
  if(role==='client'){
    nav=[['home','Mis proyectos'],['new','Nuevo proyecto']].map(([v,t])=>`<button class="${S.view===v&&!S.id?'on':''}" onclick="go('${v}')">${t}</button>`).join('');
  } else {
    const fl=foldOf(S.view);
    nav=`<button class="${S.view==='home'&&!S.id?'on':''}" onclick="go('home')">Inicio</button>${fl&&S.view!=='home'?`<span class="crumb">${fl.n}</span>`:''}`;
    if(fl&&!S.id&&fl.v&&fl.v.length>1) sub=`<div class="tabs">${fl.v.map(([v,t])=>`<button class="${S.view===v?'on':''}" onclick="go('${v}')">${t}</button>`).join('')}</div>`;
  }
  const roleLabel=role==='admin'?' · Admin':role==='staff'?' · Colaborador':role==='manager'?' · Manager':'';
  app.innerHTML=`<header class="top"><a href="index.html" class="brand"><img src="1.1.png" alt="Fluxora"></a><nav>${nav}</nav><div class="who"><span>${esc((S.p&&S.p.full_name)||S.u.email)}${roleLabel}</span><button class="lnk" onclick="sb.auth.signOut()">Salir</button></div></header><main class="pm">${sub}${S.id?detail():V[S.view]?V[S.view]():V.home()}</main>`;
  const c=document.querySelector('.chat');if(c)c.scrollTop=c.scrollHeight;
  if(admin()&&S.view==='quote'&&!S.id)Q.u();
}

 async save(){const k=S.dk;if(!admin()&&!k.project_id){alert('Elige un proyecto para guardar el documento.');return}const d=DOCS[k.kind],row={kind:k.kind,title:k.title||(d.n+(k.h.proyecto?' · '+k.h.proyecto:'')),project_id:k.project_id,data:{h:k.h,t:k.t},updated_at:new Date().toISOString()};

  ${S.D.msg.length?`<div class="card"><div class="chat">${S.D.msg.map(m=>`<div class="msg ${m.sender_id===S.u.id?'me':''}"><small>${m.sender_id===S.u.id?'Tú':'Fluxora'} · ${ft(m.created_at)}</small><p>${esc(m.body)}</p></div>`).join('')}</div><small>El proyecto está cerrado, el chat es solo de lectura.</small></div>`:''}

function detail(){
  const p=S.projects.find(x=>x.id===S.id);
  if(!p) return '<div class="card empty">Proyecto no encontrado.</div>';
  if(S.p.role==='client'&&p.status==='cancelado') return closedView(p);

  // tabs depend on role
  const tabs=[['resumen','Resumen'],['chat','Chat'],['mods','Modificaciones']];
  if(admin()) tabs.push(['pagos','Pagos']);
  if(canManage()) tabs.push(['reparto','Reparto'],['archivo','Archivo']);

  const backTo=team()?'projects':'home';
  return `<button class="lnk" onclick="go('${backTo}')">← Volver</button>
  <div class="card ${stc(p.status)}"><div class="row2"><h1>${esc(p.title)}</h1>${bd(p.status)}</div>
  <div class="bar"><i style="width:${p.progress}%"></i></div>
  <small>${p.progress}% completado${canManage()?' · '+esc(p.profiles&&p.profiles.full_name||p.client_name||''):''}${canManage()&&p.profiles?' · '+esc(p.profiles.email||''):''}</small></div>
  <div class="tabs">${tabs.map(([k,t])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${t}</button>`).join('')}</div>

}

const A={
async auth(e,m){e.preventDefault();const f=new FormData(e.target),msg=document.getElementById('msg');
  if(m==='up'&&f.get('pass')!==f.get('pass2')){msg.textContent='Las contraseñas no coinciden.';return false}
  msg.textContent='Un momento...';
  const r=m==='in'?await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('pass')}):await sb.auth.signUp({email:f.get('email'),password:f.get('pass'),options:{data:{full_name:f.get('name')},emailRedirectTo:location.href.split('#')[0]}});
  if(r.error)msg.textContent=tr(r.error.message);
  else if(m==='up'&&!r.data.session)msg.textContent='Cuenta creada. Confirma tu correo y luego inicia sesión.';
  return false},
async reset(){const em=(document.querySelector('input[name=email]').value||'').trim(),msg=document.getElementById('msg');
  if(!em){msg.textContent='Escribe tu correo arriba primero.';return}
  msg.textContent='Enviando...';const r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]});
  msg.textContent=r.error?tr(r.error.message):'Listo. Si ese correo tiene cuenta, te enviamos un enlace.'},
async newpass(e){e.preventDefault();const f=new FormData(e.target),msg=document.getElementById('msg');
  if(f.get('pass')!==f.get('pass2')){msg.textContent='Las contraseñas no coinciden.';return false}
  const r=await sb.auth.updateUser({password:f.get('pass')});
  if(r.error){msg.textContent=tr(r.error.message);return false}
  S.rec=false;history.replaceState(null,'',location.pathname);const u=await sb.auth.getUser();init(u.data.user);return false},

pkCollect(){const fm=document.querySelector('form[onsubmit*=siteSave]');if(!fm||!S.dr)return;

  S.dr.packages=n.map((x,i)=>({name:x.value.trim(),price:+pp[i].value||0,features:pf[i].value.split('\n').map(t=>t.trim()).filter(Boolean)}));
  const sn=[...fm.querySelectorAll('[name=sn]')],sp=[...fm.querySelectorAll('[name=sp]')],sk=[...fm.querySelectorAll('[name=sk]')],su=[...fm.querySelectorAll('[name=su]')];
  S.dr.services=sn.map((x,i)=>({name:x.value.trim(),price:+sp[i].value||0,kind:sk[i].value,unit:su[i].value.trim()}));
  Object.keys(S.dr.contact).forEach(k=>{if(fm.elements[k])S.dr.contact[k]=fm.elements[k].value.trim()})},
pkAdd(){A.pkCollect();S.dr.packages.push({name:'Nuevo paquete',price:0,features:[]});render()},
pkRm(i){A.pkCollect();S.dr.packages.splice(i,1);render()},
svAdd(){A.pkCollect();S.dr.services.push({name:'Nuevo servicio',price:0,kind:'extra',unit:'por video'});render()},
svRm(i){A.pkCollect();S.dr.services.splice(i,1);render()},
async siteSave(e){e.preventDefault();A.pkCollect();const m=document.getElementById('smsg');
  if(!S.dr.packages.length){m.textContent='Deja al menos un paquete.';return false}
  S.dr.contact.wa=S.dr.contact.wa.replace(/\D/g,'');S.dr.contact.ig=S.dr.contact.ig.replace('@','');
  const r=await sb.from('site_settings').upsert([{key:'packages',value:S.dr.packages},{key:'contact',value:S.dr.contact},{key:'services',value:S.dr.services}]);
  if(r.error){m.textContent=r.error.message;return false}m.textContent='Guardado.';S.set.packages=S.dr.packages;S.set.contact=S.dr.contact;S.set.services=S.dr.services;return false},

tmSel(id){S.tm=id;render()},
async role(uid,v){if(uid===S.u.id){render();return}if(!confirm('¿Cambiar el rol de esta persona?')){render();return}
  const r=await sb.from('profiles').update({role:v}).eq('id',uid);if(r.error)alert(r.error.message);await load();render()},
async mem(uid,pid,on){const r=on?await sb.from('project_members').insert({project_id:pid,user_id:uid}):await sb.from('project_members').delete().eq('project_id',pid).eq('user_id',uid);if(r.error)alert(r.error.message);await load();render()}
};

/* ══════════════════════════════════════════
   BOOT
══════════════════════════════════════════ */
if(SUPABASE_URL.includes('TU-PROYECTO')){
  app.innerHTML='<div class="card auth"><h1>Falta conectar Supabase</h1><small>Pega tu Project URL y anon key en la parte de CONFIGURACION.</small></div>';
}else{
  S.rec=location.hash.includes('type=recovery');
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY') S.rec=true;
    if(session&&session.user&&S.rec){setTimeout(recView,0)}
    else if(session&&session.user){if(!S.u||S.u.id!==session.user.id)setTimeout(()=>init(session.user),0)}
    else{S.u=null;S.p=null;S.view='home';S.id=null;if(ch){sb.removeChannel(ch);ch=null}authView()}
  });
}
</script>
